<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TwitArchive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="static/css/styles.css">
</head>
<body class="bg-black text-gray-100 min-h-screen">
  <div class="flex max-w-7xl mx-auto">

    <!-- Left Sidebar -->
    <aside class="hidden md:flex flex-col w-[88px] xl:w-[275px] sticky top-0 h-screen px-2 py-3 border-r border-[#2f3336]">
      <a href="#" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#e7e9ea]/10 transition-standard mb-2 ml-2">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <nav class="flex-1 space-y-1">
        <a href="#" id="homeLink" class="flex items-center gap-4 px-4 py-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard text-xl group">
          <svg class="w-7 h-7 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M12 9c-2.209 0-4 1.791-4 4s1.791 4 4 4 4-1.791 4-4-1.791-4-4-4zm0 6c-1.103 0-2-.897-2-2s.897-2 2-2 2 .897 2 2-.897 2-2 2z"/><path d="M20 10V7c0-1.103-.897-2-2-2h-3V3c0-1.103-.897-2-2-2h-2c-1.103 0-2 .897-2 2v2H6c-1.103 0-2 .897-2 2v3H2c-1.103 0-2 .897-2 2v2c0 1.103.897 2 2 2h2v3c0 1.103.897 2 2 2h3v2c0 1.103.897 2 2 2h2c1.103 0 2-.897 2-2v-2h3c1.103 0 2-.897 2-2v-3h2c1.103 0 2-.897 2-2v-2c0-1.103-.897-2-2-2h-2zM6 7h12v3h2v2h-2v2h2v2h-2v3H6v-3H4v-2h2v-2H4v-2h2V7z"/></svg>
          <span class="hidden xl:inline font-bold">Home</span>
        </a>
        <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard text-xl group opacity-50 cursor-not-allowed">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span class="hidden xl:inline">Explore</span>
        </a>
        <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard text-xl group opacity-50 cursor-not-allowed">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="hidden xl:inline">Notifications</span>
        </a>
        <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard text-xl group opacity-50 cursor-not-allowed">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span class="hidden xl:inline">Messages</span>
        </a>
        <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard text-xl group opacity-50 cursor-not-allowed">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
          <span class="hidden xl:inline">Bookmarks</span>
        </a>
        <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard text-xl group opacity-50 cursor-not-allowed">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="hidden xl:inline">Profile</span>
        </a>
      </nav>
      <div class="mt-auto px-2 pb-4">
        <div class="flex items-center gap-3 p-3 rounded-full hover:bg-[#e7e9ea]/10 transition-standard cursor-pointer">
          <div class="w-10 h-10 rounded-full bg-[#202327] flex items-center justify-center flex-shrink-0">
            <svg class="w-6 h-6 text-[#71767b]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
          </div>
          <div class="hidden xl:block overflow-hidden">
            <div class="font-bold text-[15px] truncate">TwitArchive</div>
            <div class="text-[#71767b] text-[15px] truncate">@offline_store</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Feed -->
    <main class="flex-1 min-w-0 border-r border-[#2f3336] max-w-[600px] bg-black">
      <!-- Sticky Header -->
      <div class="sticky top-0 z-30 bg-black/60 backdrop-blur-md border-b border-[#2f3336]">
        <div class="px-4 py-3 flex items-center justify-between">
          <h2 class="text-xl font-bold text-[#e7e9ea]">Home</h2>
          <div class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-[#e7e9ea]/10 transition-standard cursor-pointer">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5.1-2.4-7.5-1.3L7.7 4.8 4.8 7.7 1.7 4.6C.6 7 .9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
          </div>
        </div>
        <div class="flex">
          <button id="tabForYou" class="flex-1 py-4 text-[15px] font-bold text-[#e7e9ea] hover:bg-[#e7e9ea]/10 transition-standard relative">
            <span class="relative z-10">For you</span>
            <span id="tabForYouIndicator" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-14 h-1 bg-[#1d9bf0] rounded-full"></span>
          </button>
          <button id="tabFollowing" class="flex-1 py-4 text-[15px] font-medium text-[#71767b] hover:bg-[#e7e9ea]/10 transition-standard relative">
            <span class="relative z-10">Following</span>
            <span id="tabFollowingIndicator" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-14 h-1 bg-[#1d9bf0] rounded-full hidden"></span>
          </button>
        </div>
      </div>

      <!-- Feed Content -->
      <div id="feed" class="divide-y divide-[#2f3336]"></div>

      <!-- Pagination -->
      <div id="pagination" class="border-t border-[#2f3336] p-4 flex items-center justify-center gap-4 bg-black"></div>
    </main>

    <!-- Right Sidebar -->
    <aside class="hidden lg:block w-[350px] sticky top-0 h-screen overflow-y-auto px-6 py-3 space-y-4">
      <div class="sticky top-0 bg-black pt-1 pb-3 z-20">
        <div class="bg-[#202327] rounded-full px-4 py-3 flex items-center gap-3 border border-transparent focus-within:border-[#1d9bf0] focus-within:bg-black transition-standard">
          <svg class="w-5 h-5 text-[#71767b] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="search" id="searchInputRight" class="bg-transparent text-[15px] text-[#e7e9ea] placeholder-[#71767b] focus:outline-none w-full" placeholder="Search">
        </div>
      </div>

      <div class="bg-[#16181c] rounded-2xl overflow-hidden">
        <h3 class="text-xl font-extrabold px-4 py-3 text-[#e7e9ea]">Trends for you</h3>
        <div id="trendsList"></div>
        <button class="w-full text-left px-4 py-4 text-[#1d9bf0] hover:bg-white/5 transition-standard text-[15px]">Show more</button>
      </div>

      <div class="bg-[#16181c] rounded-2xl overflow-hidden">
        <h3 class="text-xl font-extrabold px-4 py-3 text-[#e7e9ea]">Archive Stats</h3>
        <div id="statsList" class="px-4 pb-4 space-y-3"></div>
      </div>

      <footer class="px-4 text-[13px] text-[#71767b] space-x-2 leading-relaxed">
        <a href="#" class="hover:underline">Terms of Service</a>
        <a href="#" class="hover:underline">Privacy Policy</a>
        <a href="#" class="hover:underline">Cookie Policy</a>
        <a href="#" class="hover:underline">Accessibility</a>
        <a href="#" class="hover:underline">Ads info</a>
        <span>© 2026 TwitArchive</span>
      </footer>
    </aside>

  </div>

  <!-- Lightbox -->
  <div id="lightbox"></div>

  <script src="static/js/app.js"></script>
</body>
</html>
